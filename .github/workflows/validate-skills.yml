name: Validate skills

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # SKILL.md frontmatter 是 skills.sh 加载技能的唯一入口，字段缺失会静默不显示
      - name: 校验 SKILL.md frontmatter
        run: |
          python3 - <<'PY'
          import pathlib, re, sys

          REQUIRED = ("name", "description")
          errors = []
          for f in sorted(pathlib.Path("skills").glob("*/SKILL.md")):
              text = f.read_text(encoding="utf-8")
              m = re.match(r"^---\n(.*?)\n---\n", text, re.S)
              if not m:
                  errors.append(f"{f}: 缺少 YAML frontmatter")
                  continue
              fm = m.group(1)
              for key in REQUIRED:
                  if not re.search(rf"^{key}:", fm, re.M):
                      errors.append(f"{f}: frontmatter 缺少 {key}")
              name = re.search(r"^name:\s*(\S+)", fm, re.M)
              if name and name.group(1) != f.parent.name:
                  errors.append(f"{f}: name={name.group(1)} 与目录名 {f.parent.name} 不一致")
              if len(text.splitlines()) < 60:
                  errors.append(f"{f}: 正文过短（<60 行），疑似占位")

          if errors:
              print("\n".join(errors))
              sys.exit(1)
          print("skills OK")
          PY

      # 单文件膨胀会让 Agent 整份读进上下文，白烧 token；上限 500 行
      - name: 校验单文件行数 ≤ 500
        run: |
          python3 - <<'PY'
          import pathlib, sys

          LIMIT = 500
          SKIP_DIRS = {".git", "node_modules", "__pycache__", ".venv"}
          bad = []
          for f in sorted(pathlib.Path(".").rglob("*")):
              if not f.is_file() or f.suffix not in {".md", ".py"}:
                  continue
              if SKIP_DIRS & set(f.parts):
                  continue
              n = len(f.read_text(encoding="utf-8").splitlines())
              if n > LIMIT:
                  bad.append(f"{f}: {n} 行 (> {LIMIT})")
          if bad:
              print("\n".join(bad))
              sys.exit(1)
          print("file size OK")
          PY

      # CLI 必须保持仅标准库，否则安装方还要装依赖
      - name: 校验 CLI 仅用标准库且可运行
        run: |
          python3 -m compileall -q skills/gpustack-manager/scripts
          if grep -rnE '^\s*(import|from)\s+(requests|httpx|yaml|click|rich)\b' skills/gpustack-manager/scripts; then
            echo "引用了第三方依赖"; exit 1
          fi
          python3 skills/gpustack-manager/scripts/gpustack.py --help > /dev/null
          echo "cli OK"

      # 密钥不能进仓库
      - name: 校验无明文密钥
        run: |
          if grep -rnE '(gpustack_[A-Za-z0-9]{8,}_[A-Za-z0-9]{8,}|Bearer [0-9]{6,})' --include="*.md" --include="*.py" .; then
            echo "疑似明文密钥"; exit 1
          fi
          echo "no secret OK"
